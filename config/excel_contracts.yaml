# Reviewed column contracts for the cleaned SDG&E QDR CSVs.
#
# Every column of every cleaned file is assigned exactly one bucket:
#
#   identity     how the fact/record id is derived
#   semantic     human metric concept used to group semantic cards
#   measure      value + unit (long_metric) or melted columns (wide_risk)
#   period       reporting year/quarter and the 14/15 vintage-vs-reporting axes
#   promoted     typed dimension columns on excel_facts / excel_records
#   json         dimensions jsonb (filterable, untyped)
#   annotations  comments / blank_meaning
#   provenance   source location + crosswalk & schema audit metadata
#   entity       entity-record mapping (families: entity)
#   excluded     never persisted anywhere (sensitive)
#   ignored      present but carries no signal; recorded in column_inventory only
#
# A column absent from all buckets is reported as unknown and is NOT loaded.

version: excel-contracts-v1

defaults:
  utility: utility_id
  annotations: [comments, blank_meaning]

tables:

  # ---------------------------------------------------------------- Table 1
  table_01:
    family: entity
    title: WMP activities
    description: >-
      SDG&E Wildfire Mitigation Plan activities and programs with annual
      targets, cumulative quarterly progress, and completion status.
    identity:
      column: record_id
    entity:
      type: wmp_activity
      key: activity_tracking_id
      title: wmp_activity_name
      date_start: project_start_date
      date_end: project_end_date
      status: status
    period:
      year: reporting_year
      quarter: reporting_quarter
    promoted: []
    json:
      - activity_classification
      - wmp_category
      - wmp_initiative
      - wmp_initiative_name_if_other
      - wmp_section
      - wmp_activity_code
      - metric_number
      - wmp_page_number
      - submission_date
      - risk_target_reduction
      - midyear_target
      - quant_target_units
      - annual_quant_target
      - annual_qual_target
      - quant_actual_progress_q1
      - quant_actual_progress_q1_2
      - quant_actual_progress_q1_3
      - quant_actual_progress_q1_4
      - qual_actual_progress_q1
      - qual_actual_progress_q1_2
      - qual_actual_progress_q1_3
      - qual_actual_progress_q1_4
      - corrective_actions_if_delayed
      - activity_description
      - activity_objective
      - legacy_wmp_category_section
      - legacy_energy_safety_activity
      - legacy_activity_name_if_other
      - annual_target_join_status
      - annual_target_source_type
      - compliance_reference
    searchable_text:
      - wmp_activity_name
      - activity_objective
      - wmp_category
      - wmp_initiative
      - wmp_initiative_name_if_other
      - risk_target_reduction
      - annual_qual_target
      - qual_actual_progress_q1
      - qual_actual_progress_q1_2
      - qual_actual_progress_q1_3
      - qual_actual_progress_q1_4
      - corrective_actions_if_delayed
      - status
    provenance:
      - source_file
      - source_sheet
      - source_row
      - source_revision
      - source_schema
      - annual_target_source_file
      - annual_target_source_sheet
      - annual_target_source_row
      - annual_target_source_url
    annotations: [comments]
    # Goal 7: personal data and internal links never reach retrieval.
    excluded:
      - person_in_charge_name
      - person_in_charge_email
      - folder_link
    ignored:
      - audit
      - audit_file_documentation_requested

