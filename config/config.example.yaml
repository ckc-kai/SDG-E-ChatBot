# Non-secret application configuration.
# Copy to config/config.yaml. Keep passwords/API keys in .env or your AWS
# secret/IAM configuration; config/config.yaml and .env are gitignored.

database:
  provider: postgresql
  # local | rds | aurora. All three use the same PostgreSQL code path.
  deployment: local
  host: localhost
  port: 5433
  name: postgres
  user: postgres
  password_env: POSTGRES_PASSWORD
  sslmode: prefer
  connect_timeout_seconds: 10

models:
  embedding:
    # Provider interface is ready for extension; this is the implemented provider.
    provider: sentence_transformers
    name: BAAI/bge-base-en-v1.5
    dimensions: 768
    max_tokens_per_chunk: 400
    minimum_chunk_chars: 20
    token_overlap: 50
  reranker:
    provider: sentence_transformers
    name: BAAI/bge-reranker-base

query_rewrite:
  model: claude-haiku-4-5-20251001
  mode: auto
  max_subquestions: 2

retrieval:
  embedding_mode: hybrid
  hybrid_pool_mode: union
  retrieval_top_k: 30
  rerank_top_k: 10
  rrf_k: 60
  # Soft metadata evidence, not a reserved table/figure result quota.
  caption_rerank_weight: 0.25
  lexical_caption_weight: 4.0
  lexical_hint_weight: 0.25
  deduplicate_exact_content: true
  # "off" keeps legacy global ranking. Set to "all" to retrieve/rerank each
  # narrative, structured-PDF, and Excel lane independently before merging.
  lane_mode: off
  lane_confidence_floor: 0.0
  # The fitted curves are retained for diagnostics but are disabled because
  # calibration regressed narrative ranking in the combined evaluation.
  score_calibration: off

extraction:
  structured:
    enabled: true
    extractor_version: docling-v1
    min_table_rows: 2
    min_table_cols: 2
    min_figure_area_px: 10000
    images_scale: 2.0
    # 0 converts a PDF in one pass; N>0 bounds memory with N-page batches.
    page_batch_size: 0
    figure_description:
      # Docling's local SmolVLM description is an unverified retrieval hint.
      generate: true
      candidate_retrieval: true
      reranking: false
      answer_context: false

object_storage:
  # filesystem for local development; s3 for AWS.
  provider: filesystem
  filesystem:
    root: resources/wmp/figures
  s3:
    bucket: replace-me
    prefix: sdge-chatbot/figures
    region: us-west-2
