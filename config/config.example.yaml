# Non-secret application configuration.
# Copy to config/config.yaml. Keep passwords/API keys in .env or your AWS
# secret/IAM configuration; config/config.yaml and .env are gitignored.

database:
  provider: postgresql
  # local | rds | aurora. All three use the same PostgreSQL code path.
  deployment: local
  host: localhost
  port: 5433
  name: postgres
  user: postgres
  password_env: POSTGRES_PASSWORD
  sslmode: prefer
  connect_timeout_seconds: 10

models:
  embedding:
    # Provider interface is ready for extension; this is the implemented provider.
    provider: sentence_transformers
    # Encodes queries and documents asymmetrically: queries carry
    # prompt_name="query", documents carry none. See retrieval.utils.encode_query.
    name: Qwen/Qwen3-Embedding-0.6B
    dimensions: 1024
    # ~One chunk per page. A median page of this corpus is 403 tokens.
    max_tokens_per_chunk: 512
    minimum_chunk_chars: 20
    token_overlap: 64
    # Tables are kept whole where possible; header repetition replaces overlap.
    table_max_tokens_per_chunk: 2000
    table_token_overlap: 0
    embedding_batch_size: 64
    table_embedding_batch_size: 16
  reranker:
    provider: sentence_transformers
    name: BAAI/bge-reranker-base

query_rewrite:
  model: claude-haiku-4-5-20251001
  # Retrieval remains fully local unless an application opts into rewriting.
  mode: "off"
  max_subquestions: 2

retrieval:
  # Keep incomparable content shapes in independently ranked result groups.
  # The old flat merge remains available through the compatibility API.
  output_mode: grouped
  embedding_mode: hybrid
  hybrid_pool_mode: union
  retrieval_top_k: 30
  rerank_top_k: 10
  # Bounds peak unified memory on Apple Silicon during cross-encoder scoring.
  rerank_batch_size: 8
  rrf_k: 60
  # Safe with grouped output: it cannot displace narrative evidence.
  # Set to 0.0 when reproducing the former merged-route baseline.
  caption_rerank_weight: 0.25
  lexical_caption_weight: 4.0
  lexical_hint_weight: 0.25
  # Focused AND terms keep the indexed lexical lane selective. Use "off" for an
  # ablation; broad_or is rollback-only because it scans most of this corpus.
  lexical_query_mode: focused
  deduplicate_exact_content: true
  # "off" keeps legacy global ranking. Set to "all" to retrieve/rerank each
  # narrative, structured-PDF, and Excel lane independently before merging.
  lane_mode: off
  lane_confidence_floor: 0.0
  # The fitted curves are retained for diagnostics but are disabled because
  # calibration regressed narrative ranking in the combined evaluation.
  score_calibration: off

extraction:
  structured:
    enabled: true
    extractor_version: docling-v1
    min_table_rows: 2
    min_table_cols: 2
    min_figure_area_px: 10000
    images_scale: 2.0
    # 0 converts a PDF in one pass; N>0 bounds memory with N-page batches.
    page_batch_size: 0
    figure_description:
      # Docling's local SmolVLM description is an unverified retrieval hint.
      # Keep the base ingest independent from a multi-GB vision-model download.
      # These can be enabled later and refreshed without re-ingesting facts.
      generate: false
      candidate_retrieval: false
      reranking: false
      answer_context: false

object_storage:
  # filesystem for local development; s3 for AWS.
  provider: filesystem
  filesystem:
    root: resources/wmp/figures
  s3:
    bucket: replace-me
    prefix: sdge-chatbot/figures
    region: us-west-2

# Runtime overrides use SDGE_FEATURE_<UPPERCASE_NAME>=true|false. Each
# architecture experiment remains independently reversible.
architecture_features:
  two_resource_router: true
  support_evidence_judge: true
  typed_planner: true
  parallel_retrieval: true
  coverage_retry: true
  metadata_routing: true
  cross_resource_computation: true
  # Rank on small children, hand the model the whole section (<=2500 tokens).
  parent_child_expansion: true
