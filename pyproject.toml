[project]
name = "sdg-e-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.117.0",
    "docling>=2.114.0",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.12",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "sentence-transformers>=5.6.0",
    "tqdm>=4.66.0",
    # Added for the backend application layer (Member 4):
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

# Dev-only dependencies -- needed to run tests (FastAPI's TestClient
# requires httpx), not needed in the production deployment image.
[dependency-groups]
dev = [
    "httpx>=0.27.0",
]